<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Intelligence Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="main-header">
            <div class="logo">
                <span class="radar-icon">📡</span>
                <h1>RADAR <span class="dim">INTELLIGENCE</span></h1>
            </div>
            <nav class="main-nav">
                <a href="#/" class="nav-item active" id="nav-home">LIVE</a>
                <a href="#/map" class="nav-item" id="nav-map">NETWORK MAP</a>
                <a href="#/history" class="nav-item" id="nav-history">ARCHIVE</a>
            </nav>
            <div class="header-info">
                <button id="btn-scan" class="btn-action">SCAN NOW</button>
                <div id="clock" class="mono">--:--:--</div>
                <div id="refresh-indicator" class="spinner"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="view-container">
            <!-- Views will be injected here by JS -->
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <p>Daemon running stealth as <span class="mono">kworker/sys</span> | Local Intelligence Mode</p>
        </footer>
    </div>

    <!-- Templates -->
    <template id="tpl-history">
        <section class="history-view">
            <div class="section-header">
                <h2>DEVICE ARCHIVE (TOTAL HISTORY)</h2>
                <div class="controls">
                    <input type="text" id="history-search" placeholder="Search archive...">
                </div>
            </div>
            <div class="panel glass no-padding">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th>Identity</th>
                            <th>First Seen</th>
                            <th>Last Seen</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- History rows injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </template>
    <template id="tpl-home">
        <section class="home-view">
            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Devices</h3>
                    <p id="stat-total-devices" class="large">--</p>
                </div>
                <div class="stat-card">
                    <h3>Online Now</h3>
                    <p id="stat-active-today" class="large">--</p>
                </div>
                <div class="stat-card">
                    <h3>CPU Usage</h3>
                    <div class="progress-bar-container">
                        <div id="cpu-bar" class="progress-bar"></div>
                    </div>
                    <p id="stat-cpu">--%</p>
                </div>
                <div class="stat-card">
                    <h3>RAM Usage</h3>
                    <div class="progress-bar-container">
                        <div id="ram-bar" class="progress-bar"></div>
                    </div>
                    <p id="stat-ram">--%</p>
                </div>
                <div class="stat-card">
                    <h3>Battery</h3>
                    <p id="stat-battery">--% <span id="stat-charging"></span></p>
                </div>
            </div>

            <div class="content-split">
                <!-- App Focus -->
                <div class="panel glass">
                    <h2>[APP FOCUS MONITOR]</h2>
                    <div class="app-status">
                        <div class="current-app">
                            <span class="label">Current App:</span>
                            <span id="current-app-name" class="highlight">--</span>
                            <span id="idle-badge" class="badge">--</span>
                        </div>
                        <div class="window-title">
                            <span class="label">Window Title:</span>
                            <span id="window-title-text" class="dim small">--</span>
                        </div>
                    </div>
                    <div class="top-apps-list">
                        <h3>Today's Top Apps</h3>
                        <ul id="top-apps-ul">
                            <!-- Injected -->
                        </ul>
                    </div>
                    <div class="top-apps-list" style="margin-top: 15px;">
                        <h3>Top Internet Consumers</h3>
                        <ul id="top-bandwidth-ul">
                            <li class="dim small">Loading data...</li>
                        </ul>
                    </div>
                </div>

                <!-- Network Info -->
                <div class="panel glass">
                    <h2>[NETWORK STATUS]</h2>
                    <div class="wifi-info">
                        <p>SSID: <span id="wifi-ssid" class="highlight">--</span></p>
                        <p>Signal: <span id="wifi-signal" class="mono">-- dBm</span></p>
                    </div>
                    <div class="network-meta">
                        <p>Gateway: <span id="gateway-ip" class="mono">192.168.10.1</span></p>
                    </div>
                </div>
            </div>

            <!-- Device List -->
            <div class="device-section">
                <div class="section-header">
                    <h2>NETWORK RECONNAISSANCE</h2>
                    <div class="controls">
                        <input type="text" id="device-search" placeholder="Search devices...">
                    </div>
                </div>
                <div id="device-grid" class="device-grid">
                    <!-- Device cards injected here -->
                </div>
            </div>
        </section>
    </template>

    <!-- Device Forensics Page Template -->
    <template id="tpl-forensics">
        <section class="forensics-view">
            <button id="btn-back" class="btn-text">← Back to Dashboard</button>

            <!-- Header Card -->
            <div class="forensics-hero glass">
                <div class="forensics-hero-left">
                    <div class="device-icon-lg" id="forensics-icon">📱</div>
                    <div>
                        <h1 id="forensics-name" class="forensics-title">Loading...</h1>
                        <p id="forensics-mac" class="mono dim small">--:--:--:--:--:--</p>
                        <p id="forensics-manufacturer" class="dim small" style="margin-top:4px"></p>
                    </div>
                </div>
                <div class="forensics-hero-right">
                    <div class="forensics-status-badge" id="forensics-status">● Online</div>
                    <div class="forensics-os-badge" id="forensics-os-badge">Scanning OS...</div>
                    <div style="margin-top:12px">
                        <button id="btn-export-logs" class="btn-action" style="background:rgba(0,255,136,0.1);border-color:var(--accent-green);color:var(--accent-green)">EXPORT LOGS</button>
                    </div>
                    <p class="dim small" style="text-align:right;margin-top:8px">Confidence: <span id="forensics-confidence" class="highlight">--%</span></p>
                </div>
            </div>

            <!-- Identity + OS Fingerprint Row -->
            <div class="forensics-grid-2">
                <div class="panel glass">
                    <h3>🌐 Network Identity</h3>
                    <div class="info-table">
                        <div class="info-row"><span class="label">IP Address</span><span id="forensics-ip" class="mono highlight">--</span></div>
                        <div class="info-row"><span class="label">MAC Address</span><span id="forensics-mac2" class="mono">--</span></div>
                        <div class="info-row"><span class="label">Device Type</span><span id="forensics-type">--</span></div>
                        <div class="info-row"><span class="label">mDNS Name</span><span id="forensics-mdns" class="mono">--</span></div>
                        <div class="info-row"><span class="label">SSDP / Service</span><span id="forensics-ssdp" class="dim small">--</span></div>
                        <div class="info-row"><span class="label">First Seen</span><span id="forensics-first-seen" class="dim small">--</span></div>
                        <div class="info-row"><span class="label">Last Seen</span><span id="forensics-last-seen" class="dim small">--</span></div>
                    </div>
                </div>
                <div class="panel glass">
                    <h3>🔬 OS Fingerprint Analysis</h3>
                    <div class="os-fingerprint-display">
                        <div class="os-icon-large" id="forensics-os-icon">❓</div>
                        <div class="os-details">
                            <p class="os-name" id="forensics-os-name">Scanning...</p>
                            <p class="dim small" id="forensics-os-method">Method: --</p>
                        </div>
                    </div>
                    <div class="os-signals" id="forensics-os-signals">
                        <!-- Signal badges injected here -->
                    </div>
                    <div style="margin-top:20px">
                        <p class="dim small">Current Activity</p>
                        <p id="forensics-activity" class="highlight" style="margin-top:6px;font-size:1rem">--</p>
                        <p class="dim small" style="margin-top:8px">Traffic Summary</p>
                        <p id="forensics-traffic" class="dim small" style="margin-top:4px">--</p>
                    </div>
                </div>
            </div>

            <!-- Protocol Breakdown + Bandwidth Row -->
            <div class="forensics-grid-2" style="margin-top:20px">
                <div class="panel glass">
                    <h3>📊 Protocol Breakdown</h3>
                    <div id="forensics-proto-chart" class="proto-chart">
                        <span class="dim small">Collecting traffic data...</span>
                    </div>
                </div>
                <div class="panel glass">
                    <h3>💾 Open Ports &amp; Services</h3>
                    <div id="forensics-ports" class="ports-container">
                        <span class="dim small">Scanning...</span>
                    </div>
                    <div style="margin-top:24px">
                        <h3>⚡ Tactical Controls</h3>
                        <div class="tactical-controls-row">
                            <button id="btn-tactical-start" class="btn-action" style="display:none">INITIATE INTERCEPTION</button>
                            <button id="btn-tactical-stop" class="btn-action" style="background:rgba(255,68,102,0.1);border-color:#ff4466;color:#ff4466;display:none">STOP INTERCEPTION</button>
                            <p id="tactical-status" class="dim small" style="margin-top:8px">Checking...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DNS History -->
            <div class="panel glass" style="margin-top:20px">
                <div class="section-header" style="margin-bottom:16px">
                    <h3>🔍 DNS Query History</h3>
                    <input type="text" id="dns-search" placeholder="Filter domains..." style="background:rgba(255,255,255,0.05);border:1px solid var(--border-glass);color:white;padding:8px 16px;border-radius:20px;outline:none;width:250px;font-size:0.85rem">
                </div>
                <div class="session-table-container">
                    <table class="session-table" style="font-size:0.82rem">
                        <thead><tr><th>#</th><th>Domain / Host</th><th>Method</th><th>Timestamp</th></tr></thead>
                        <tbody id="forensics-dns-body">
                            <tr><td colspan="4" class="dim small" style="text-align:center;padding:20px">Loading DNS history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Full DPI Flow Log -->
            <div class="panel glass" style="margin-top:20px">
                <h3>📡 Live Traffic Flow Analysis</h3>
                <div class="session-table-container">
                    <table class="session-table" style="font-size:0.82rem">
                        <thead><tr><th>Time</th><th>Destination IP</th><th>Resolved Host / Service</th><th>Port</th><th>Protocol</th><th>Size</th></tr></thead>
                        <tbody id="forensics-flows-body">
                            <tr><td colspan="6" class="dim small" style="text-align:center;padding:20px">No flows captured yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </template>

    <template id="tpl-map">
        <section class="map-view">
            <div class="section-header">
                <h2>INTERACTIVE NETWORK MAP</h2>
                <div class="controls">
                    <span class="dim small">Drag nodes to interact. Click nodes to view Deep Intel.</span>
                </div>
            </div>
            <div class="panel glass no-padding" style="position: relative;">
                <div id="d3-container" style="width: 100%; height: 600px;"></div>
                <div id="d3-tooltip" class="d3-tooltip"></div>
            </div>
        </section>
    </template>

    <template id="tpl-intelligence">
        <section class="intel-detail-view">
            <button id="btn-back" class="btn-text">← Back</button>
            <div class="intel-header glass" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2>DEEP TRAFFIC INTELLIGENCE</h2>
                    <div id="intel-device-name" class="highlight">Loading Device...</div>
                </div>
                <div class="tactical-controls" style="text-align: right;">
                    <button id="btn-tactical-start" class="btn-action" style="background: var(--color-accent); display: none;">INITIATE INTERCEPTION</button>
                    <button id="btn-tactical-stop" class="btn-action" style="background: #e74c3c; display: none;">STOP INTERCEPTION</button>
                    <div id="tactical-status" class="dim small" style="margin-top: 5px;">Checking tactical status...</div>
                </div>
            </div>

            <div class="intel-grid">
                <div class="panel glass">
                    <h3>Bandwidth Consumption</h3>
                    <div class="bandwidth-meter">
                        <div id="bandwidth-fill" class="fill"></div>
                    </div>
                    <p id="total-usage" class="large mono">0.00 MB</p>
                    <p class="dim small">Data intercepted in this session</p>
                </div>

                <div class="panel glass">
                    <h3>Service Breakdown</h3>
                    <ul id="top-services-list" class="top-apps-list">
                        <!-- Top domains injected here -->
                    </ul>
                </div>
            </div>

            <div class="panel glass">
                <h3>Live Flow Analysis</h3>
                <div class="session-table-container">
                    <table class="session-table">
                        <tbody id="intel-flow-body">
                            <!-- Live flows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </template>

    <div id="toast-container"></div>
    <script src="/static/js/main.js"></script>
</body>
</html>
